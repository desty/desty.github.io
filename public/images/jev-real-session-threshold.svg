<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Jev threshold trade-off on a real Claude Code session</title>
  <desc id="desc">Average future-reference recall stays at 100 percent through threshold 0.2 while irrelevant-call removal stays near zero. At threshold 0.3 recall falls to 76.9 percent and removal reaches 20.4 percent.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #243044; }
    .title { font-size: 26px; font-weight: 700; }
    .label { font-size: 16px; }
    .tick { font-size: 14px; fill: #64748b; }
    .note { font-size: 15px; fill: #991b1b; font-weight: 600; }
    .grid { stroke: #dbe3ee; stroke-width: 1; }
    .axis { stroke: #64748b; stroke-width: 1.5; }
    .recall { fill: none; stroke: #2563eb; stroke-width: 4; }
    .removal { fill: none; stroke: #ea580c; stroke-width: 4; }
    .point-recall { fill: #2563eb; }
    .point-removal { fill: #ea580c; }
  </style>
  <rect width="1000" height="560" rx="18" fill="#f8fafc"/>
  <text x="80" y="55" class="title">Real Claude Code session: threshold trade-off</text>
  <text x="80" y="82" class="note">No tested threshold achieved both high recall and useful removal.</text>
  <line x1="100" y1="440" x2="920" y2="440" class="axis"/>
  <line x1="100" y1="110" x2="100" y2="440" class="axis"/>
  <line x1="100" y1="440" x2="920" y2="440" class="grid"/>
  <line x1="100" y1="357.5" x2="920" y2="357.5" class="grid"/>
  <line x1="100" y1="275" x2="920" y2="275" class="grid"/>
  <line x1="100" y1="192.5" x2="920" y2="192.5" class="grid"/>
  <line x1="100" y1="110" x2="920" y2="110" class="grid"/>
  <text x="72" y="445" class="tick">0%</text><text x="62" y="362" class="tick">25%</text>
  <text x="62" y="280" class="tick">50%</text><text x="62" y="198" class="tick">75%</text><text x="52" y="115" class="tick">100%</text>
  <text x="120" y="470" class="tick">0.05</text><text x="270" y="470" class="tick">0.1</text>
  <text x="420" y="470" class="tick">0.2</text><text x="570" y="470" class="tick">0.3</text>
  <text x="720" y="470" class="tick">0.4</text><text x="870" y="470" class="tick">0.5</text>
  <text x="445" y="510" class="label">keep threshold</text>
  <polyline points="135,110 285,110 435,110 585,186 735,305 885,362" class="recall"/>
  <polyline points="135,440 285,440 435,438 585,373 735,209 885,131" class="removal"/>
  <g class="point-recall"><circle cx="135" cy="110" r="7"/><circle cx="285" cy="110" r="7"/><circle cx="435" cy="110" r="7"/><circle cx="585" cy="186" r="7"/><circle cx="735" cy="305" r="7"/><circle cx="885" cy="362" r="7"/></g>
  <g class="point-removal"><circle cx="135" cy="440" r="7"/><circle cx="285" cy="440" r="7"/><circle cx="435" cy="438" r="7"/><circle cx="585" cy="373" r="7"/><circle cx="735" cy="209" r="7"/><circle cx="885" cy="131" r="7"/></g>
  <line x1="585" y1="186" x2="585" y2="373" stroke="#991b1b" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="600" y="270" class="note">0.3: recall 76.9%, removal 20.4%</text>
  <line x1="650" y1="45" x2="690" y2="45" class="recall"/><text x="702" y="51" class="label">future-reference recall</text>
  <line x1="650" y1="75" x2="690" y2="75" class="removal"/><text x="702" y="81" class="label">irrelevant-call removal</text>
</svg>
