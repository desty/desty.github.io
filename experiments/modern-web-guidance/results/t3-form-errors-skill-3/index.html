<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Tasks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Team Tasks</h1>
  </header>

  <main>
    <form id="add-form" class="card" novalidate>
      <h2>Add a task</h2>
      <label for="title">Title</label>
      <input id="title" name="title" type="text" required minlength="3" data-error="title-error">
      <p id="title-error" class="error-msg"><span role="img" aria-label="Error">⚠</span> Enter a title of at least 3 characters.</p>

      <label for="owner-email">Owner email</label>
      <input id="owner-email" name="owner" type="email" required autocomplete="email" data-error="owner-email-error">
      <p id="owner-email-error" class="error-msg"><span role="img" aria-label="Error">⚠</span> Enter an email address in the format you@example.com.</p>

      <label for="due">Due date <span class="help-icon" tabindex="0">?</span></label>
      <input id="due" name="due" type="date" required data-error="due-error">
      <p id="due-error" class="error-msg"><span role="img" aria-label="Error">⚠</span> Choose a due date.</p>

      <button type="submit">Add task</button>
    </form>

    <ul id="task-list" class="card">
      <li data-id="1"><span>Write release notes</span> <button class="delete" data-id="1">Delete</button></li>
      <li data-id="2"><span>Review onboarding PR</span> <button class="delete" data-id="2">Delete</button></li>
      <li data-id="3"><span>Update status page</span> <button class="delete" data-id="3">Delete</button></li>
    </ul>
  </main>

  <script src="app.js"></script>
</body>
</html>
