<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script>
    // Apply the saved theme before first paint to avoid a flash of the wrong scheme.
    try { document.querySelector('meta[name="color-scheme"]').content = localStorage.getItem('color-scheme') ?? 'light dark'; } catch {}
  </script>
  <title>Team Tasks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Team Tasks</h1>
    <fieldset class="theme-switch">
      <legend class="visually-hidden">Theme</legend>
      <label><input type="radio" name="theme" value="light"> Light</label>
      <label><input type="radio" name="theme" value="dark"> Dark</label>
      <label><input type="radio" name="theme" value="light dark" checked> System
        <span class="system-now" data-scheme="light">(light)</span><span class="system-now" data-scheme="dark">(dark)</span></label>
    </fieldset>
  </header>

  <main>
    <form id="add-form" class="card" novalidate>
      <h2>Add a task</h2>
      <label for="title">Title</label>
      <input id="title" name="title" type="text" required minlength="3">

      <label for="owner-email">Owner email</label>
      <input id="owner-email" name="owner" type="email" required>

      <label for="due">Due date <span class="help-icon" tabindex="0">?</span></label>
      <input id="due" name="due" type="date" required>

      <button type="submit">Add task</button>
    </form>

    <ul id="task-list" class="card">
      <li data-id="1"><span>Write release notes</span> <button class="delete" data-id="1">Delete</button></li>
      <li data-id="2"><span>Review onboarding PR</span> <button class="delete" data-id="2">Delete</button></li>
      <li data-id="3"><span>Update status page</span> <button class="delete" data-id="3">Delete</button></li>
    </ul>
  </main>

  <script src="app.js"></script>
</body>
</html>
